aid: heavybit
name: Heavybit
description: >-
  Heavybit is a venture capital firm, founded in 2013, that invests from the earliest
  stages in enterprise infrastructure and developer tooling: software tools for engineering teams, AI,
  cloud-native infrastructure, open source, DevOps and DevSecOps. It writes $500K to $10M checks from
  pre-seed to Series A, says it is happy to lead the first day-0 check, and has launched 80+ startups
  with founders in 15 countries and 47 cities. Founders are supported by a community of 1,000+ domain
  advisors, the DevGuild event series, a library and podcast network, and the DevToolsDigest newsletter.
  Portfolio includes Stripe, PagerDuty (IPO), Snyk, Netlify, LaunchDarkly, CircleCI, Tailscale,
  Apollo GraphQL, ReadMe, Contentful, Mux and Replicate.
